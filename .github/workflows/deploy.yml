- name: SSH鍵のセットアップとデプロイ
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          # ★修正：変数の名前を「FTP_」から「SSH_」に合わせる
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          # 1. 鍵の配置
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # 2. rsyncで一発デプロイ
          # ★ 変更：--exclude を追加し、Xserver上の画像やPHPが消し飛ばされるのを防ぐ
          rsync -avz --delete \
            --exclude="upload-api.php" \
            --exclude="uploads/" \
            --exclude="src/" \
            -e "ssh -p 10022 -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" \
            ./out/ $SSH_USER@$SSH_HOST:~/fudan-photo.com/public_html/
